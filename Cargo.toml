[package]
name = "radiomaster"
version = "0.2.8"
edition = "2021"
description = "RadioMaster — radio automation for Icecast/Shoutcast/AzuraCast, written in Rust"
build = "build.rs"
license = "MIT"
readme = "README.md"
keywords = ["radio", "automation", "icecast", "azuracast", "broadcast"]
categories = ["multimedia::audio"]

[[bin]]
name = "RadioMaster"
path = "src/main.rs"

# The headless server (no window): desktop apps connect to it with File → Connect to Server.
[[bin]]
name = "RadioMaster-Server"
path = "src/server_main.rs"

[dependencies]
ab_glyph = "0.2.32"
flate2 = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.31", features = ["datepicker", "serde"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
mp3lame-encoder = "0.2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
walkdir = "2"
dirs = "5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rand = "0.8"
rfd = "0.15"
anyhow = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
argon2 = { version = "0.5", features = ["std"] }
tiny_http = "0.12"
urlencoding = "2"
# RadioMaster-Server: stop cleanly on Ctrl+C / service stop, read the password without showing it
ctrlc = { version = "3", features = ["termination"] }
rpassword = "7"
# HTTPS for RadioMaster Server and Connect to Server (the same rustls that ureq uses)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
# Let's Encrypt for RadioMaster Server: signs its ACME requests (the ring that rustls already uses)
ring = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "=0.50.5"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
