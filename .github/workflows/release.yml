name: Release

# Push a tag like v0.2.0 to build RadioMaster.exe and publish a GitHub release with it
# (plus macOS, Linux and the headless RadioMaster Server for Linux and Windows).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Stops the release before anything is built if the tag doesn't match the version in the code
  # (a tag pushed before the release prep would otherwise ship the previous version).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml, Cargo.lock, the installer and CHANGELOG.md
        run: python3 tools/check_versions.py "${GITHUB_REF_NAME}"

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Code signing turns "Unknown publisher" into the publisher's name in Windows SmartScreen. It runs
      # once Azure Artifact Signing is set up (docs/CODE-SIGNING.md); without it the files ship unsigned.
      - name: Sign RadioMaster.exe and RadioMaster-Server.exe
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          # the top level of target\release holds just the two programs
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: RadioMaster
          description-url: https://radiomaster.dovafm.com
      - name: Package
        shell: pwsh
        run: |
          $name = "RadioMaster-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/RadioMaster.exe $name/
          Copy-Item README.md, LICENSE, CHANGELOG.md, PLUGINS.md $name/
          Copy-Item -Recurse lang $name/lang
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package RadioMaster Server
        shell: pwsh
        run: |
          $name = "RadioMaster-Server-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/RadioMaster-Server.exe $name/
          Copy-Item docs/SERVER.md, LICENSE, CHANGELOG.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          choco upgrade innosetup -y --no-progress   # Inno Setup 6.3+ (x64compatible)
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $iscc "/DAppVersion=$ver" installer\RadioMaster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: RadioMaster Setup
          description-url: https://radiomaster.dovafm.com
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: python tools/changelog_section.py "${{ github.ref_name }}" notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # (the first pattern also takes RadioMaster-Server-*-windows-x64.zip)
          files: |
            RadioMaster-*-windows-x64.zip
            dist/RadioMaster-Setup-*.exe
          body_path: notes.md

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="RadioMaster-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/RadioMaster README.md LICENSE CHANGELOG.md PLUGINS.md "$name/"
          cp -r lang "$name/lang"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-linux-x64.tar.gz

  server-linux:
    needs: verify
    # an older Ubuntu, so the binary also runs on older server distributions (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin RadioMaster-Server
      - name: Package
        run: |
          name="RadioMaster-Server-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/RadioMaster-Server docs/SERVER.md server/radiomaster-server.service LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-Server-*-linux-x64.tar.gz

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A universal app for Apple Silicon and Intel Macs. Developer ID signing and notarization run when
      # the Apple secrets are set (docs/CODE-SIGNING.md); otherwise the app is ad-hoc signed.
      - name: Build and package RadioMaster.app
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package_macos.sh "${GITHUB_REF_NAME#v}" "RadioMaster-${GITHUB_REF_NAME}-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-macos.zip
