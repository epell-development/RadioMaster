name: Release

# Push a tag like v0.2.0 to build RadioMaster.exe and publish a GitHub release with it
# (plus macOS, Linux and the headless RadioMaster Server for Linux and Windows).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "RadioMaster-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/RadioMaster.exe $name/
          Copy-Item README.md, LICENSE, CHANGELOG.md, PLUGINS.md $name/
          Copy-Item -Recurse lang $name/lang
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package RadioMaster Server
        shell: pwsh
        run: |
          $name = "RadioMaster-Server-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/RadioMaster-Server.exe $name/
          Copy-Item docs/SERVER.md, LICENSE, CHANGELOG.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          choco upgrade innosetup -y --no-progress   # Inno Setup 6.3+ (x64compatible)
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & $iscc "/DAppVersion=$ver" installer\RadioMaster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: python tools/changelog_section.py "${{ github.ref_name }}" notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # (the first pattern also takes RadioMaster-Server-*-windows-x64.zip)
          files: |
            RadioMaster-*-windows-x64.zip
            dist/RadioMaster-Setup-*.exe
          body_path: notes.md

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="RadioMaster-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/RadioMaster README.md LICENSE CHANGELOG.md PLUGINS.md "$name/"
          cp -r lang "$name/lang"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-linux-x64.tar.gz

  server-linux:
    # an older Ubuntu, so the binary also runs on older server distributions (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin RadioMaster-Server
      - name: Package
        run: |
          name="RadioMaster-Server-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/RadioMaster-Server docs/SERVER.md server/radiomaster-server.service LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-Server-*-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package RadioMaster.app
        run: |
          app=RadioMaster.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/RadioMaster "$app/Contents/MacOS/RadioMaster"
          cp -r lang "$app/Contents/MacOS/lang"
          mkdir icon.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/RadioMaster.icns"
          ver="${GITHUB_REF_NAME#v}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>RadioMaster</string>
            <key>CFBundleDisplayName</key><string>RadioMaster</string>
            <key>CFBundleIdentifier</key><string>com.dovafm.radiomaster</string>
            <key>CFBundleVersion</key><string>$ver</string>
            <key>CFBundleShortVersionString</key><string>$ver</string>
            <key>CFBundleExecutable</key><string>RadioMaster</string>
            <key>CFBundleIconFile</key><string>RadioMaster</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSMicrophoneUsageDescription</key><string>RadioMaster uses the microphone for live talk-overs and voice tracks.</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app" || true
          ditto -c -k --keepParent "$app" "RadioMaster-${GITHUB_REF_NAME}-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-macos.zip
