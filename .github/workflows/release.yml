name: Release

# Push a tag like v0.2.0 to build RadioMaster.exe and publish a GitHub release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "RadioMaster-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/RadioMaster.exe $name/
          Copy-Item README.md, LICENSE, CHANGELOG.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-windows-x64.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="RadioMaster-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/RadioMaster README.md LICENSE CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: RadioMaster-*-linux-x64.tar.gz
